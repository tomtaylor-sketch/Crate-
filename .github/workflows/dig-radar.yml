# Runs Dig Radar every morning on GitHub's servers, publishes the results to your GitHub Pages site,
# and pings your phone via ntfy. Nothing to host. Free on a public repo.
#
# One-time setup:  repo Settings -> Secrets and variables -> Actions -> New repository secret:
#   YOUTUBE_API_KEY, DISCOGS_TOKEN, DISCOGS_USERNAME, NTFY_TOPIC  (optional: ANTHROPIC_API_KEY,
#   SOUNDCLOUD_CLIENT_ID, SOUNDCLOUD_CLIENT_SECRET)
# Keep radar_config.json in the repo with the keys left blank; secrets are injected as env vars.

name: Dig Radar

on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC daily
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Harvest, resolve, report, notify
        env:
          DIGRADAR_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DIGRADAR_DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DIGRADAR_DISCOGS_USERNAME: ${{ secrets.DISCOGS_USERNAME }}
          DIGRADAR_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DIGRADAR_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGRADAR_LLM_ENABLED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          DIGRADAR_SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          DIGRADAR_SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
        run: |
          python dig_radar.py all --limit 60
          mkdir -p radar
          cp radar_targets.json radar/radar_targets.json

      - name: Commit results back to the repo (this also redeploys GitHub Pages)
        run: |
          git config user.name "dig-radar-bot"
          git config user.email "dig-radar-bot@users.noreply.github.com"
          git add radar.db radar_targets.json radar_report.html radar/radar_targets.json
          git commit -m "Dig Radar $(date -u +%F)" || echo "nothing new"
          git push
